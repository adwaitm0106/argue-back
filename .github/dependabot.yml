version: 2
updates:
  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # ESLint and Prettier are the only dependencies this project has, and they're both
  # dev-only — the extension itself still ships with zero runtime dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
