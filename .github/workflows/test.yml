name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node tests/run.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifest.json is well-formed
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest.json OK')"

      - name: Install dev dependencies (ESLint, Prettier — no runtime dependencies exist)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run the test suite
        run: npm test
