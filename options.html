<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Argue Back Settings</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1d1d1f; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p { color: #555; }
    label { display: block; font-weight: 600; margin: 20px 0 6px; }
    input, select { width: 100%; padding: 8px 10px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 20px; padding: 8px 16px; font: inherit; border-radius: 8px; border: 0; background: #5b3df5; color: #fff; cursor: pointer; }
    button.secondary { background: #eee; color: #222; margin-left: 8px; }
    #status { margin-left: 10px; color: #1f9d55; }
    small { color: #777; }
  </style>
</head>
<body>
  <h1>Argue Back</h1>
  <p>Paste an OpenRouter key once. It stays in your browser storage and is only ever sent to openrouter.ai.</p>

  <label for="apiKey">OpenRouter API key</label>
  <input id="apiKey" type="password" placeholder="sk-or-v1-..." autocomplete="off">
  <small>Get one free at openrouter.ai/keys</small>

  <label for="model">Model</label>
  <select id="model">
    <option value="auto">Auto (best free model, falls back if busy)</option>
    <option value="nvidia/nemotron-3-super-120b-a12b:free">Nemotron 3 Super 120B (free)</option>
    <option value="google/gemma-4-31b-it:free">Gemma 4 31B (free)</option>
    <option value="qwen/qwen3.8-27b:free">Qwen 3.8 27B (free)</option>
    <option value="nvidia/nemotron-3-ultra-550b-a55b:free">Nemotron 3 Ultra 550B (free)</option>
  </select>

  <div>
    <button id="save">Save</button>
    <button id="clear" class="secondary">Clear cached results</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
