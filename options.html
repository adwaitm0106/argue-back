<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Argue Back Settings</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1d1d1f; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p { color: #555; }
    label { display: block; font-weight: 600; margin: 20px 0 6px; }
    input, select { width: 100%; padding: 8px 10px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
    .key-row { display: flex; gap: 8px; align-items: center; }
    .key-row input { flex: 1; }
    button { padding: 8px 16px; font: inherit; border-radius: 8px; border: 0; background: #5b3df5; color: #fff; cursor: pointer; white-space: nowrap; }
    button.secondary { background: #eee; color: #222; }
    button:disabled { opacity: .6; cursor: default; }
    .actions { margin-top: 20px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #keyStatus { margin-top: 8px; font-size: 13.5px; min-height: 1.4em; }
    #keyStatus.ok { color: #1f9d55; }
    #keyStatus.warn { color: #c58a00; }
    #keyStatus.error { color: #d6453d; }
    #status { color: #1f9d55; }
    small { color: #777; }
    .provider-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .provider-card {
      border: 2px solid #ddd; border-radius: 10px; padding: 10px; cursor: pointer; text-align: center; font-size: 13px;
    }
    .provider-card.active { border-color: #5b3df5; background: #f4f1ff; }
    .provider-card b { display: block; font-size: 14px; margin-bottom: 2px; }
    .provider-card span { color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Argue Back</h1>
  <p>Pick a provider, paste its key once. It stays in your browser storage and is only ever sent to that provider.</p>

  <label>Provider</label>
  <div class="provider-grid" id="providerGrid">
    <div class="provider-card" data-provider="groq">
      <b>Groq</b>
      <span>up to 14,400/day</span>
    </div>
    <div class="provider-card" data-provider="gemini">
      <b>Gemini</b>
      <span>1,500/day</span>
    </div>
  </div>

  <label for="apiKey">API key <span id="keyProviderLabel"></span></label>
  <div class="key-row">
    <input id="apiKey" type="password" placeholder="" autocomplete="off">
    <button id="testKey" class="secondary" type="button">Test key</button>
  </div>
  <div id="keyStatus"></div>
  <small id="keyHint"></small>

  <label for="model">Model</label>
  <select id="model"></select>

  <div class="actions">
    <button id="save">Save</button>
    <button id="clear" class="secondary">Clear cached results</button>
    <span id="status"></span>
  </div>

  <script src="llm_client.js"></script>
  <script src="options.js"></script>
</body>
</html>
